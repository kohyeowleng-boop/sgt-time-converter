<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SGT → London / New York Live Clock</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #f5f5f3;
    color: #1a1a1a;
    min-height: 100vh;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 2rem 1rem;
  }
  .container { width: 100%; max-width: 700px; }
  h1 { font-size: 22px; font-weight: 500; margin-bottom: 0.4rem; color: #111; }
  .subtitle { font-size: 14px; color: #555; margin-bottom: 1.5rem; }
  .cards-row { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 1.5rem; }
  .tz-card {
    background: #fff; border: 0.5px solid #ddd; border-radius: 12px;
    padding: 1rem 1.25rem; flex: 1; min-width: 180px;
  }
  .tz-card.highlight { border-color: #90bde8; }
  .tz-label { font-size: 14px; color: #444; margin-bottom: 6px; font-weight: 500; }
  .tz-time { font-size: 42px; font-weight: 500; color: #111; line-height: 1.2; font-variant-numeric: tabular-nums; }
  .tz-date { font-size: 13px; color: #555; margin-top: 6px; }
  .tz-status {
    font-size: 13px; margin-top: 10px; padding: 3px 10px;
    border-radius: 6px; display: inline-block; font-weight: 500;
  }
  .open { background: #d4f0e0; color: #1a6e40; }
  .closed { background: #f0f0ee; color: #888; }
  .pre { background: #fef3d4; color: #8a5a00; }
  .session-title { font-size: 14px; color: #444; margin-bottom: 8px; font-weight: 500; }
  .bar-wrap { position: relative; height: 28px; margin-bottom: 4px; }
  .bar-track {
    position: absolute; top: 50%; transform: translateY(-50%);
    width: 100%; height: 8px; background: #eee; border-radius: 4px;
  }
  .bar-fill { position: absolute; top: 0; height: 100%; border-radius: 4px; }
  .now-line {
    position: absolute; top: 0; width: 2px; height: 100%;
    background: #1a1a1a; border-radius: 2px;
  }
  .legend { display: flex; gap: 16px; font-size: 13px; color: #555; margin-top: 6px; }
  .legend span { display: flex; align-items: center; gap: 4px; }
  .leg-dot { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
  .leg-line { width: 12px; height: 2px; background: #1a1a1a; display: inline-block; }
  .tick-label {
    position: absolute; font-size: 11px; font-weight: 500;
    transform: translateX(-50%); white-space: nowrap; line-height: 1;
  }
  .bar-labels { display: flex; justify-content: space-between; font-size: 13px; color: #666; margin-top: 4px; }
  .dst-note { font-size: 13px; color: #555; margin-top: 1.2rem; line-height: 1.8; }
  @media (prefers-color-scheme: dark) {
    body { background: #1a1a1a; color: #eee; }
    h1 { color: #eee; }
    .subtitle, .session-title { color: #aaa; }
    .tz-card { background: #252525; border-color: #3a3a3a; }
    .tz-card.highlight { border-color: #2a5a8a; }
    .tz-label { color: #bbb; }
    .tz-time { color: #f0f0f0; }
    .tz-date { color: #888; }
    .closed { background: #2a2a2a; color: #666; }
    .open { background: #0d3322; color: #5cd490; }
    .pre { background: #2e2500; color: #d4a832; }
    .bar-track { background: #333; }
    .now-line { background: #eee; }
    .leg-line { background: #eee; }
    .legend { color: #aaa; }
    .bar-labels { color: #888; }
    .dst-note { color: #888; }
    #lon-open-lbl, #lon-close-lbl { color: #7ab8f5; }
    #ny-open-lbl,  #ny-close-lbl  { color: #5cd4a8; }
  }
</style>
</head>
<body>
<div class="container">
  <h1>SGT → London &amp; New York live clock</h1>
  <p class="subtitle">Updates every second · DST auto-adjusted</p>

  <div class="cards-row">
    <div class="tz-card highlight">
      <div class="tz-label">Singapore (SGT, UTC+8)</div>
      <div class="tz-time" id="sgt-time">—</div>
      <div class="tz-date" id="sgt-date">—</div>
    </div>
    <div class="tz-card">
      <div class="tz-label" id="lon-label">London</div>
      <div class="tz-time" id="lon-time">—</div>
      <div class="tz-date" id="lon-date">—</div>
      <span class="tz-status" id="lon-status">—</span>
    </div>
    <div class="tz-card">
      <div class="tz-label" id="ny-label">New York</div>
      <div class="tz-time" id="ny-time">—</div>
      <div class="tz-date" id="ny-date">—</div>
      <span class="tz-status" id="ny-status">—</span>
    </div>
  </div>

  <div>
    <div class="session-title">Market sessions in SGT (today)</div>
    <div style="position:relative; height:22px; margin-bottom:2px;">
      <span class="tick-label" id="lon-open-lbl" style="color:#1a5a9e;"></span>
      <span class="tick-label" id="lon-close-lbl" style="color:#1a5a9e;"></span>
      <span class="tick-label" id="ny-open-lbl" style="color:#0d6e4f;"></span>
      <span class="tick-label" id="ny-close-lbl" style="color:#0d6e4f;"></span>
    </div>
    <div class="bar-wrap">
      <div class="bar-track">
        <div class="bar-fill" id="lon-bar" style="background:#378ADD;"></div>
        <div class="bar-fill" id="ny-bar" style="background:#1D9E75;"></div>
        <div class="now-line" id="now-line"></div>
      </div>
    </div>
    <div class="legend">
      <span><span class="leg-dot" style="background:#378ADD;"></span>London (LSE)</span>
      <span><span class="leg-dot" style="background:#1D9E75;"></span>New York (NYSE/NASDAQ)</span>
      <span><span class="leg-line"></span>Now</span>
    </div>
    <div class="bar-labels"><span>00:00</span><span>06:00</span><span>12:00</span><span>18:00</span><span>24:00</span></div>
  </div>

  <p class="dst-note" id="dst-note"></p>
</div>

<script>
function getLastSunday(y, m) {
  const d = new Date(y, m + 1, 0);
  d.setDate(d.getDate() - d.getDay());
  return d;
}
function getNthSunday(y, m, n) {
  const d = new Date(y, m, 1);
  let count = 0;
  while (d.getMonth() === m) {
    if (d.getDay() === 0) { count++; if (count === n) return new Date(d); }
    d.setDate(d.getDate() + 1);
  }
}
function isUkDst(d) {
  return d >= getLastSunday(d.getFullYear(), 2) && d < getLastSunday(d.getFullYear(), 9);
}
function isUsDst(d) {
  return d >= getNthSunday(d.getFullYear(), 2, 2) && d < getNthSunday(d.getFullYear(), 10, 1);
}
function pad(n) { return String(n).padStart(2, '0'); }
function fmtTime(d) { return pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds()); }
function fmtDate(d) { return d.toLocaleDateString('en-SG', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' }); }
function fmtShort(d) { return d.toLocaleDateString('en-SG', { day: 'numeric', month: 'short' }); }
function relDay(base, target) {
  const diff = Math.round((new Date(target.getFullYear(), target.getMonth(), target.getDate()) - new Date(base.getFullYear(), base.getMonth(), base.getDate())) / 86400000);
  if (diff === 1) return fmtDate(target) + ' (tomorrow)';
  if (diff === -1) return fmtDate(target) + ' (yesterday)';
  return fmtDate(target);
}
function inRange(cur, open, dur) {
  const end = (open + dur) % 1440;
  return open < end ? (cur >= open && cur < end) : (cur >= open || cur < end);
}

function tick() {
  const now = new Date();
  const ukDst = isUkDst(now);
  const usDst = isUsDst(now);
  const lonOff = ukDst ? 1 : 0;
  const nyOff  = usDst ? -4 : -5;

  document.getElementById('sgt-time').textContent = fmtTime(now);
  document.getElementById('sgt-date').textContent = fmtDate(now);

  const lonDate = new Date(now.getTime() + (lonOff - 8) * 3600000);
  document.getElementById('lon-time').textContent = fmtTime(lonDate);
  document.getElementById('lon-date').textContent = relDay(now, lonDate);
  document.getElementById('lon-label').textContent = ukDst ? 'London (BST, UTC+1)' : 'London (GMT, UTC+0)';

  const nyDate = new Date(now.getTime() + (nyOff - 8) * 3600000);
  document.getElementById('ny-time').textContent = fmtTime(nyDate);
  document.getElementById('ny-date').textContent = relDay(now, nyDate);
  document.getElementById('ny-label').textContent = usDst ? 'New York (EDT, UTC−4)' : 'New York (EST, UTC−5)';

  const sgtMins   = now.getHours() * 60 + now.getMinutes();
  // Convert local open times to SGT minutes: SGT = local_minutes - local_UTC_offset*60 + 8*60
  const lonOpenSgt = (480 - lonOff * 60 + 8 * 60) % 1440;   // 08:00 London = 480 local mins
  const nyOpenSgt  = (570 - nyOff  * 60 + 8 * 60) % 1440;   // 09:30 NY     = 570 local mins

  const lonIsOpen = inRange(sgtMins, lonOpenSgt, 510);
  const nyIsOpen  = inRange(sgtMins, nyOpenSgt, 390);
  const lonIsPre  = !lonIsOpen && inRange(sgtMins, (lonOpenSgt - 30 + 1440) % 1440, 30);
  const nyIsPre   = !nyIsOpen  && inRange(sgtMins, (nyOpenSgt  - 30 + 1440) % 1440, 30);

  const lS = document.getElementById('lon-status');
  lS.className = 'tz-status ' + (lonIsOpen ? 'open' : lonIsPre ? 'pre' : 'closed');
  lS.textContent = lonIsOpen ? 'LSE open' : lonIsPre ? 'Pre-market' : 'Closed';

  const nS = document.getElementById('ny-status');
  nS.className = 'tz-status ' + (nyIsOpen ? 'open' : nyIsPre ? 'pre' : 'closed');
  nS.textContent = nyIsOpen ? 'NYSE/NASDAQ open' : nyIsPre ? 'Pre-market' : 'Closed';

  const pct  = n => ((((n % 1440) + 1440) % 1440) / 1440 * 100).toFixed(3) + '%';
  const wPct = n => (n / 1440 * 100).toFixed(3) + '%';
  const fmtMins = m => { const n = ((m % 1440) + 1440) % 1440; return pad(Math.floor(n/60)) + ':' + pad(n%60); };

  document.getElementById('lon-bar').style.left  = pct(lonOpenSgt);
  document.getElementById('lon-bar').style.width = wPct(510);
  document.getElementById('ny-bar').style.left   = pct(nyOpenSgt);
  document.getElementById('ny-bar').style.width  = wPct(390);
  document.getElementById('now-line').style.left = pct(sgtMins);

  const lonCloseSgt = lonOpenSgt + 510;
  const nyCloseSgt  = nyOpenSgt  + 390;

  const setLbl = (id, mins) => {
    const el = document.getElementById(id);
    el.style.left = pct(mins);
    el.textContent = fmtMins(mins);
  };
  setLbl('lon-open-lbl',  lonOpenSgt);
  setLbl('lon-close-lbl', lonCloseSgt);
  setLbl('ny-open-lbl',   nyOpenSgt);
  setLbl('ny-close-lbl',  nyCloseSgt);

  const y = now.getFullYear();
  let note = ukDst
    ? 'UK on BST. Reverts to GMT on ' + fmtShort(getLastSunday(y, 9)) + '. '
    : 'UK on GMT. BST starts ' + fmtShort(getLastSunday(y, 2)) + '. ';
  note += usDst
    ? 'US on EDT. Reverts to EST on ' + fmtShort(getNthSunday(y, 10, 1)) + '.'
    : 'US on EST. EDT starts ' + fmtShort(getNthSunday(y, 2, 2)) + '.';
  document.getElementById('dst-note').textContent = note;
}

tick();
setInterval(tick, 1000);
</script>
</body>
</html>
